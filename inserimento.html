<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Inserimento Peso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f3;color:#1a1a1a;padding:1rem;max-width:480px;margin:0 auto}
h1{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.sub{font-size:12px;color:#888;margin-bottom:1.5rem}
.sec{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.07em;margin:1.2rem 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
label{font-size:11px;color:#888}
input{font-size:16px;padding:9px 11px;border-radius:7px;border:.5px solid rgba(0,0,0,0.15);background:#fff;color:#1a1a1a;width:100%;-webkit-appearance:none}
input:focus{outline:none;border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
.btn{width:100%;padding:13px;border-radius:9px;border:none;font-size:15px;font-weight:500;cursor:pointer;margin-top:4px;transition:opacity .15s}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-primary:active{opacity:.7}
.btn-secondary{background:#fff;color:#1a1a1a;border:.5px solid rgba(0,0,0,0.15);margin-top:8px}
.toast{display:none;position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:999;white-space:nowrap}
.toast.show{display:block}
.toast.err{background:#993C1D}
.history{margin-top:1.5rem}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:6px;border:.5px solid rgba(0,0,0,0.08)}
.hdate{font-size:13px;font-weight:500}
.hvals{font-size:12px;color:#888}
.loader{text-align:center;padding:2rem;color:#888;font-size:13px}
.tabs-nav{display:flex;gap:6px;margin-bottom:1rem}
.tnav{font-size:13px;padding:5px 14px;border-radius:999px;border:.5px solid #ccc;background:transparent;color:#666;cursor:pointer}
.tnav.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
#viewForm, #viewHistory{display:none}
#viewForm.active, #viewHistory.active{display:block}
</style>
</head>
<body>

<h1>📊 Peso — Inserimento dati</h1>
<p class="sub" id="subtitle">Caricamento ultima rilevazione...</p>

<div class="tabs-nav">
  <button class="tnav active" onclick="showTab('form')">Inserisci</button>
  <button class="tnav" onclick="showTab('history')">Ultime rilevazioni</button>
</div>

<div id="viewForm" class="active">
  <p class="sec">nuova rilevazione</p>
  <div class="grid">
    <div class="field full">
      <label>Data</label>
      <input type="text" id="f_data" placeholder="gg/mm/aaaa">
    </div>
    <div class="field">
      <label>Peso (kg)</label>
      <input type="decimal" id="f_peso" placeholder="73.0" inputmode="decimal">
    </div>
    <div class="field">
      <label>BMI</label>
      <input type="decimal" id="f_bmi" placeholder="23.8" inputmode="decimal">
    </div>
    <div class="field">
      <label>Grasso corp. (%)</label>
      <input type="decimal" id="f_grasso" placeholder="14.9" inputmode="decimal">
    </div>
    <div class="field">
      <label>Massa grassa (kg)</label>
      <input type="decimal" id="f_mgras" placeholder="10.9" inputmode="decimal">
    </div>
    <div class="field">
      <label>Muscolo (kg)</label>
      <input type="decimal" id="f_muscolo" placeholder="58.0" inputmode="decimal">
    </div>
    <div class="field">
      <label>Musc. scheletrico (%)</label>
      <input type="decimal" id="f_mskel" placeholder="45.0" inputmode="decimal">
    </div>
    <div class="field">
      <label>Massa ossea (kg)</label>
      <input type="decimal" id="f_moss" placeholder="4.2" inputmode="decimal">
    </div>
    <div class="field">
      <label>Proteine (%)</label>
      <input type="decimal" id="f_prot" placeholder="16.0" inputmode="decimal">
    </div>
    <div class="field">
      <label>Acqua (%)</label>
      <input type="decimal" id="f_acqua" placeholder="62.4" inputmode="decimal">
    </div>
    <div class="field">
      <label>Grasso sott. (%)</label>
      <input type="decimal" id="f_gsub" placeholder="12.0" inputmode="decimal">
    </div>
    <div class="field">
      <label>Grasso viscerale</label>
      <input type="decimal" id="f_gvisc" placeholder="3" inputmode="decimal">
    </div>
    <div class="field">
      <label>BMR (kcal)</label>
      <input type="decimal" id="f_bmr" placeholder="1711" inputmode="decimal">
    </div>
    <div class="field">
      <label>Età corporea</label>
      <input type="decimal" id="f_eta" placeholder="27" inputmode="decimal">
    </div>
  </div>

  <button class="btn btn-primary" onclick="salva()">💾 Salva sul Drive</button>
  <button class="btn btn-secondary" onclick="resetForm()">↺ Cancella</button>
</div>

<div id="viewHistory">
  <p class="sec">ultime 10 rilevazioni</p>
  <div id="historyList"><div class="loader">Caricamento...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGt-umLouxzvhBe8XWjmOmZVS48FZfd3Tnr5pW9eK6G6KjQISU9jhWZnSwRkAQO7lz/exec';
const SHEET_CSV  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSaUopvY9C2Gn9_yHKCYnyagjy-5_JFL-1EWcIxhNdTcskCd0h1eolIyrt_rmizDw2Hl-BzYSfjX-9t/pub?gid=0&single=true&output=csv';
const PROXY_URLS = [
  'https://corsproxy.io/?' + encodeURIComponent(SHEET_CSV),
  'https://api.allorigins.win/raw?url=' + encodeURIComponent(SHEET_CSV),
  SHEET_CSV
];

// Imposta data di oggi automaticamente
const oggi = new Date();
const dd = String(oggi.getDate()).padStart(2,'0');
const mm = String(oggi.getMonth()+1).padStart(2,'0');
const yyyy = oggi.getFullYear();
document.getElementById('f_data').value = `${dd}/${mm}/${yyyy}`;

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function toFloat(s) {
  if (!s) return '';
  return parseFloat(s.replace(',','.'));
}

async function loadCSV() {
  for (const url of PROXY_URLS) {
    try {
      const res = await fetch(url, {cache:'no-store'});
      if (!res.ok) continue;
      const text = await res.text();
      if (text.length < 50) continue;
      const lines = text.trim().split('\n').filter(l => l.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const c = parseCSVLine(lines[i]);
        if (!c[0] || !c[1]) continue;
        rows.push(c);
      }
      return rows;
    } catch(e) { continue; }
  }
  return [];
}

async function init() {
  const rows = await loadCSV();
  if (rows.length > 0) {
    const last = rows[rows.length-1];
    document.getElementById('subtitle').textContent =
      `Ultima rilevazione: ${last[0]} · ${toFloat(last[1])} kg · ${toFloat(last[3])}% grasso`;
  } else {
    document.getElementById('subtitle').textContent = 'Pronto per nuova rilevazione';
  }
}

async function loadHistory() {
  const rows = await loadCSV();
  const el = document.getElementById('historyList');
  if (!rows.length) { el.innerHTML = '<div class="loader">Nessun dato.</div>'; return; }
  const last10 = rows.slice(-10).reverse();
  el.innerHTML = last10.map(c => `
    <div class="hrow">
      <span class="hdate">${c[0]}</span>
      <span class="hvals">${toFloat(c[1])} kg · ${toFloat(c[3])}% grasso · ${toFloat(c[5])} kg musc.</span>
    </div>
  `).join('');
}

function showTab(tab) {
  document.querySelectorAll('.tnav').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#viewForm,#viewHistory').forEach(v => v.classList.remove('active'));
  if (tab === 'form') {
    document.getElementById('viewForm').classList.add('active');
    document.querySelectorAll('.tnav')[0].classList.add('active');
  } else {
    document.getElementById('viewHistory').classList.add('active');
    document.querySelectorAll('.tnav')[1].classList.add('active');
    loadHistory();
  }
}

function getVal(id) {
  const v = document.getElementById(id).value.trim().replace(',','.');
  return v === '' ? '' : parseFloat(v);
}

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

async function salva() {
  const data = {
    data:    document.getElementById('f_data').value.trim(),
    peso:    getVal('f_peso'),
    bmi:     getVal('f_bmi'),
    grasso:  getVal('f_grasso'),
    mgras:   getVal('f_mgras'),
    muscolo: getVal('f_muscolo'),
    mskel:   getVal('f_mskel'),
    moss:    getVal('f_moss'),
    prot:    getVal('f_prot'),
    acqua:   getVal('f_acqua'),
    gsub:    getVal('f_gsub'),
    gvisc:   getVal('f_gvisc'),
    bmr:     getVal('f_bmr'),
    eta:     getVal('f_eta'),
  };

  if (!data.data || !data.peso) {
    showToast('⚠️ Inserisci almeno data e peso', true);
    return;
  }

  const btn = document.querySelector('.btn-primary');
  btn.textContent = '⏳ Salvataggio...';
  btn.disabled = true;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    showToast('✅ Salvato! La dashboard si aggiornerà a breve.');
    resetForm();
    init();
  } catch(e) {
    showToast('❌ Errore nel salvataggio. Riprova.', true);
  } finally {
    btn.textContent = '💾 Salva sul Drive';
    btn.disabled = false;
  }
}

function resetForm() {
  ['f_bmi','f_grasso','f_mgras','f_muscolo','f_mskel','f_moss','f_prot','f_acqua','f_gsub','f_gvisc','f_bmr','f_eta'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_peso').value = '';
  // Reimposta data di oggi
  document.getElementById('f_data').value = `${dd}/${mm}/${yyyy}`;
}

init();
</script>
</body>
</html>
